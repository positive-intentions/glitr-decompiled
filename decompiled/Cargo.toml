# EVIDENCE: workspace layout from docs Architecture + embedded crate paths in glitr-tui-linux
[workspace]
resolver = "2"
members = [
  "crates/messaging-schema",
  "crates/crypto-core",
  "crates/crypto-cascade",
  "crates/git-core",
  "crates/db-core",
  "crates/api-core",
  "crates/glitr-client",
]
default-members = ["crates/api-core", "crates/glitr-client"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
rand = "0.8"
sha2 = "0.10"
aes-gcm = "0.10"
argon2 = "0.5"
rsa = { version = "0.9", features = ["sha2"] }
hkdf = "0.12"
chrono = { version = "0.4", features = ["serde"] }
hex = "0.4"
zeroize = { version = "1", features = ["derive"] }
